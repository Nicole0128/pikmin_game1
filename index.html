<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你是哪一種皮克敏？</title>
  <style>
    :root {
      --bg: #f6f3ea;
      --bg-2: #eef4e8;
      --card: rgba(255, 255, 255, 0.92);
      --card-soft: rgba(250, 252, 247, 0.96);
      --border: rgba(117, 154, 103, 0.18);
      --border-strong: rgba(117, 154, 103, 0.34);
      --text: #2d3b2d;
      --text-soft: #5d6d5c;
      --green: #78aa72;
      --green-dark: #4f7e4f;
      --green-soft: #dcead5;
      --cream: #fffaf1;
      --gold: #d1a654;
      --shadow: 0 18px 38px rgba(92, 120, 84, 0.11);
      --radius: 18px;
      --radius-lg: 28px;
      --radius-xl: 34px;
      --result-color: #78aa72;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 10%, rgba(145, 193, 132, 0.16) 0, transparent 18%),
        radial-gradient(circle at 85% 18%, rgba(255, 218, 169, 0.14) 0, transparent 15%),
        radial-gradient(circle at 18% 86%, rgba(182, 214, 244, 0.14) 0, transparent 14%),
        linear-gradient(180deg, #f8f5ed 0%, #f3efe6 100%);
      min-height: 100vh;
      padding: 28px 16px 80px;
    }

    .quiz-wrap {
      max-width: 960px;
      margin: 0 auto;
      position: relative;
    }

    .quiz-wrap::before,
    .quiz-wrap::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 0;
      filter: blur(8px);
    }

    .quiz-wrap::before {
      width: 240px;
      height: 240px;
      left: -90px;
      top: 20px;
      background: radial-gradient(circle, rgba(130, 184, 122, 0.16) 0, transparent 60%);
    }

    .quiz-wrap::after {
      width: 260px;
      height: 260px;
      right: -110px;
      bottom: 30px;
      background: radial-gradient(circle, rgba(255, 208, 153, 0.14) 0, transparent 60%);
    }

    .screen {
      display: none;
      position: relative;
      z-index: 1;
      animation: rise 0.48s cubic-bezier(.22,.68,0,1.05) both;
    }

    .screen.active { display: block; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: #f2f7ed;
      border: 1px solid var(--border-strong);
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--green);
      flex-shrink: 0;
    }

    h1, h2, h3, h4 {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      color: #2b402a;
    }

    h1 {
      font-size: clamp(36px, 6vw, 62px);
      line-height: 1.07;
      letter-spacing: -0.03em;
    }

    h2 {
      font-size: clamp(26px, 4vw, 40px);
      line-height: 1.18;
      letter-spacing: -0.02em;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      transition: .24s ease;
      font: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 999px;
      padding: 15px 24px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff;
      box-shadow: 0 14px 24px rgba(87, 128, 79, 0.22);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 30px rgba(87, 128, 79, 0.28);
    }

    .btn-ghost {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border-strong);
    }

    .btn-ghost:hover:not(:disabled) {
      background: #f7fbf4;
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: .48;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 共用滿版媒體樣式：修正影片/圖片超出容器的根本問題 */
    .full-bleed-video,
    .full-bleed-media {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    /* ========== intro ========== */
    .intro-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas:
        "left right"
        "extra right";
      min-height: 700px;
    }

    .intro-left {
      grid-area: left;
      padding: 52px 44px 28px 52px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .intro-extra {
      grid-area: extra;
      padding: 0 44px 52px 52px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-width: 0;
    }

    .intro-left .badge { margin-bottom: 22px; }

    .intro-left h1 { margin-bottom: 20px; }

    .intro-lead {
      font-size: 15.5px;
      line-height: 2;
      color: var(--text-soft);
      margin-bottom: 0;
    }

    .intro-note {
      padding: 16px 20px;
      border-radius: var(--radius);
      border: 1px dashed rgba(120, 170, 114, .34);
      background: #fbfdf9;
      color: #5e6d5c;
      font-size: 13.5px;
      line-height: 1.9;
      margin-bottom: 34px;
    }

    .intro-note strong {
      color: #b98d2f;
      font-weight: 800;
    }

    .intro-right {
      grid-area: right;
      min-width: 0;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }

    .media-zone {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      border-bottom: 1px solid var(--border);
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 224, 182, 0.18) 0, transparent 20%),
        radial-gradient(circle at 82% 30%, rgba(141, 193, 129, 0.18) 0, transparent 18%),
        radial-gradient(circle at 46% 84%, rgba(180, 214, 244, 0.16) 0, transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,.54), rgba(242,247,238,.92));
    }

    .media-zone::before {
      content: "";
      position: absolute;
      width: 76%;
      height: 76%;
      border: 2px dashed rgba(121, 168, 113, .22);
      border-radius: 50%;
    }

    /* 封面右側影片區：關鍵修正 */
    .media-zone.intro-media-full,
    #media-zone-intro {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 700px;
      padding: 0;
      overflow: hidden;
      border-bottom: none;
      display: block;
    }

    #media-zone-intro::before {
      display: none;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    /* ========== quiz ========== */
    .topbar {
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: rgba(249,252,246,.8);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .q-counter {
      font-family: "Noto Serif TC", serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--green-dark);
    }

    .q-theme {
      font-size: 12px;
      color: #698067;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
    }

    .progress-wrap {
      height: 6px;
      margin: 0 28px;
      border-radius: 999px;
      background: #e8f0e1;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #95c185, #5e9a5d);
      transition: width .38s cubic-bezier(.22,.68,0,1.08);
    }

    .quiz-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 580px;
    }

    .quiz-left {
      padding: 36px 34px 28px 38px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .quiz-left h2 { margin-bottom: 16px; }

    .q-desc {
      flex: 1;
      font-size: 15px;
      line-height: 2;
      color: var(--text-soft);
    }

    .quiz-hint {
      margin-top: 18px;
      font-size: 13px;
      color: #6f8a6b;
      font-style: italic;
    }

    .quiz-right {
      display: flex;
      flex-direction: column;
    }

    .quiz-media-zone {
      flex: 0 0 auto;
      width: 100%;
      aspect-ratio: 3 / 2;
      padding: 0;
      overflow: hidden;
      min-height: 0;
      border-bottom: 1px solid var(--border);
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 223, 183, 0.16) 0, transparent 20%),
        radial-gradient(circle at 78% 24%, rgba(145, 193, 132, 0.14) 0, transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,.48), rgba(243,247,238,.82));
    }

    #question-media {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      aspect-ratio: 3 / 2;
    }

    .options-panel {
      padding: 20px 24px 28px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .opt-btn {
      position: relative;
      overflow: hidden;
      text-align: left;
      padding: 16px 16px 16px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-soft);
      cursor: pointer;
      transition: .22s ease;
      min-height: 118px;
    }

    .opt-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(120,170,114,.08), rgba(255,255,255,0));
      opacity: 0;
      transition: opacity .22s ease;
    }

    .opt-btn:hover {
      transform: translateY(-2px);
      background: #fcfefb;
      border-color: rgba(120,170,114,.34);
      box-shadow: 0 12px 22px rgba(93, 129, 84, 0.10);
      color: var(--text);
    }

    .opt-btn:hover::before { opacity: 1; }

    .opt-btn.selected {
      background: linear-gradient(135deg, #eef7e8, #ffffff);
      border-color: var(--green-dark);
      color: var(--text);
      box-shadow: 0 12px 24px rgba(93, 129, 84, 0.14);
    }

    .opt-btn.selected::after {
      content: "✓";
      position: absolute;
      top: 10px;
      right: 12px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--green-dark);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .opt-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #eef5ea;
      color: var(--green-dark);
      font-family: "Noto Serif TC", serif;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .opt-text {
      position: relative;
      z-index: 1;
      display: block;
      font-size: 13.5px;
      line-height: 1.78;
    }

    .quiz-nav {
      padding: 16px 28px;
      border-top: 1px solid var(--border);
      background: rgba(249,252,246,.82);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ========== result ========== */
    .result-hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 440px;
    }

    .result-visual-zone {
      position: relative;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      border-right: 1px solid var(--border);
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 223, 183, 0.14) 0, transparent 18%),
        radial-gradient(circle at 80% 30%, color-mix(in srgb, var(--result-color) 15%, white) 0, transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,.46), color-mix(in srgb, var(--result-color) 16%, white));
      overflow: hidden;
    }

    .result-visual-zone::before,
    .result-visual-zone::after {
      display: none;
    }

    .result-pikmin-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    .result-media-slot {
      width: 100%;
      height: 100%;
      min-height: 100%;
      border-radius: 22px;
      border: none;
      background: transparent;
      padding: 0;
      overflow: hidden;
    }

    .result-video-full {
      width: 100%;
      height: 100%;
      min-height: 100%;
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      overflow: hidden;
      border-radius: 0;
      flex: 1;
    }

    #result-video {
      width: 100%;
      height: 100%;
      min-height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      background: transparent;
    }

    .result-copy {
      padding: 36px 36px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: rgba(255,255,255,.56);
    }

    .result-copy .badge { margin-bottom: 18px; }

    .result-name {
      font-family: "Noto Serif TC", serif;
      font-size: clamp(30px, 4vw, 48px);
      font-weight: 900;
      line-height: 1.06;
      color: #2a3f29;
      margin-bottom: 6px;
    }

    .result-type {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
      color: color-mix(in srgb, var(--result-color) 72%, #425442);
    }

    .result-tagline {
      font-family: "Noto Serif TC", serif;
      font-size: 14px;
      line-height: 1.8;
      font-style: italic;
      color: #987431;
      background: rgba(255,250,241,.72);
      border-left: 3px solid #d4b067;
      padding: 12px 16px;
      border-radius: 0 14px 14px 0;
      margin-bottom: 18px;
    }

    .result-desc p {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.95;
      color: #586957;
    }

    .result-sections {
      padding: 0 28px 36px;
      background: rgba(251,253,249,.78);
    }

    .section-title {
      font-family: "Noto Serif TC", serif;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #6f8b6a;
      font-weight: 800;
      margin-bottom: 14px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    .section-title:first-child {
      padding-top: 0;
      border-top: none;
    }

    .trait-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .trait-card,
    .insight-card,
    .match-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 22px rgba(92, 120, 84, 0.06);
    }

    .trait-card {
      padding: 18px;
    }

    .trait-card h4,
    .insight-card h4,
    .match-card h4 {
      font-family: "Noto Serif TC", serif;
      font-size: 12px;
      font-weight: 800;
      color: #637861;
      margin-bottom: 12px;
      letter-spacing: .04em;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 11px;
      border-radius: 999px;
      background: #f2f7ee;
      border: 1px solid #dde8d7;
      font-size: 12px;
      color: #5d6d5b;
      font-weight: 700;
    }

    .insight-grid,
    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .insight-grid { margin-top: 24px; }
    .match-grid { margin-top: 24px; }

    .insight-card,
    .match-card {
      padding: 18px 20px;
    }

    .insight-card p,
    .match-card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.9;
      color: #5d6c5c;
    }

    .match-name {
      font-family: "Noto Serif TC", serif;
      font-size: 20px;
      font-weight: 900;
      color: #2f452e;
      margin-bottom: 8px;
    }

    .result-actions {
      padding: 24px 28px;
      border-top: 1px solid var(--border);
      background: rgba(249,252,246,.82);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .result-actions.single-action {
      justify-content: center;
    }

    .result-actions.single-action .btn {
      min-width: 220px;
    }

    .match-image-slot {
      width: 220px;
      aspect-ratio: 1 / 1;
      margin: 6px auto 16px;
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .match-image-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.08));
      -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 70%, rgba(0,0,0,0.88) 82%, rgba(0,0,0,0.38) 94%, rgba(0,0,0,0) 100%);
      mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 70%, rgba(0,0,0,0.88) 82%, rgba(0,0,0,0.38) 94%, rgba(0,0,0,0) 100%);
    }

    @media (max-width: 760px) {
      .intro-inner {
        display: flex;
        flex-direction: column;
      }

      .quiz-body,
      .result-hero {
        grid-template-columns: 1fr;
      }

      .intro-left,
      .intro-right,
      .intro-extra {
        width: 100%;
      }

      .intro-left {
        display: flex;
        flex-direction: column;
        padding: 32px 24px 24px;
        border-right: none;
        border-bottom: none;
      }

      .intro-right {
        order: 2;
        width: 100%;
        min-width: 0;
        overflow: hidden;
      }

      #media-zone-intro {
        order: 2;
        width: 100%;
        min-width: 0;
        min-height: 260px;
        height: 260px;
        overflow: hidden;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }

      #intro-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .intro-extra {
        order: 3;
        padding: 0 24px 24px;
        border-right: none;
        border-bottom: none;
      }

      .intro-note {
        order: 3;
        margin-top: 20px;
        margin-bottom: 20px;
      }

      #start-btn {
        order: 4;
      }

      .quiz-left,
      .result-visual-zone {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .quiz-left { padding: 28px; }
      .result-copy { padding: 28px; }

      .trait-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 520px) {
      body { padding: 14px 12px 40px; }

      .option-grid,
      .trait-grid,
      .insight-grid,
      .match-grid {
        grid-template-columns: 1fr;
      }

      .quiz-nav {
        justify-content: stretch;
      }

      .quiz-nav .btn,
      .result-actions .btn,
      .intro-left .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-wrap">

    <!-- intro -->
    <div class="screen active" id="screen-intro">
      <div class="card">
        <div class="intro-inner">
          <div class="intro-left">
            <div class="badge">互動心理測驗</div>
            <h1>你是哪一種<br>皮克敏？</h1>

            <p class="intro-lead">
              從日常習慣、壓力反應、在人群中的位置，<br>
              測出你最像哪一隻皮克敏。<br>
              依整體傾向加權判定，讓結果更像真正的你。
            </p>
          </div>

          <div class="intro-right">
            <div class="media-zone intro-media-full" id="media-zone-intro">
              <video
                id="intro-video"
                class="full-bleed-video"
                autoplay
                muted
                loop
                playsinline
                preload="auto"
              >
                <source src="video/intro.mp4" type="video/mp4">
              </video>
            </div>
          </div>

          <div class="intro-extra">

        result: null

        quiz: $("screen-quiz"),
        result: $("screen-result")
      };

      function show(name) {
        Object.values(screens).forEach(s => s.classList.remove("active"));
        screens[name].classList.add("active");
        window.scrollTo({ top: 0, behavior: "smooth" });

      function playBgm() {
        try {
          const bgm = document.getElementById("bgm-main");
          if (!bgm) return;
          bgm.volume = 0.4;
          bgm.play();
        } catch (e) {
          // 沒放音檔或播放失敗時不要報錯
        }
      }

      function renderQ() {
        const q = questions[state.qi];
        const total = questions.length;
        const selected = state.answers[state.qi];

        $("q-counter").textContent = `第 ${state.qi + 1} 題 / 共 ${total} 題`;
        $("q-theme").textContent = q.theme;
        $("q-title").textContent = q.title;
        $("q-desc").textContent = q.description;

        const qMedia = document.getElementById("question-media");
        if (qMedia) {
          qMedia.src = `image/question-${q.id}.jpg`;
          qMedia.alt = `題目 ${q.id} 情境圖`;
        }

        const container = $("options-container");
        container.innerHTML = "";

        q.options.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "opt-btn" + (selected === i ? " selected" : "");
          btn.innerHTML = `
            <span class="opt-label">${String.fromCharCode(65 + i)}</span>
            <span class="opt-text">${opt.text}</span>
          `;
          btn.addEventListener("click", () => {
            state.answers[state.qi] = i;
            renderQ();
          });
          container.appendChild(btn);
        });

        $("prev-btn").disabled = state.qi === 0;
        $("next-btn").textContent = state.qi === total - 1 ? "看結果 →" : "下一題 →";
        $("quiz-hint").textContent = selected === null
          ? "請先選擇一個最接近你的答案。"
          : "你可以重新點選其他選項修改答案。";

        const answered = state.answers.filter(v => v !== null).length;
        $("progress-fill").style.width = `${(answered / total) * 100}%`;
      }

      function calcScores() {
        const scores = baseScores();

        questions.forEach((q, qi) => {
          const ai = state.answers[qi];
          if (ai === null) return;

          const picked = q.options[ai];
          Object.entries(picked.scores).forEach(([k, v]) => {
            scores[k] += v;
            if (q.keyQuestion) scores[k] += Math.floor(v * 0.5);
          });
        });

        return scores;
      }

      function decisiveScores() {
        const scores = baseScores();
        const di = questions.findIndex(q => q.decisive);
        if (di < 0 || state.answers[di] === null) return scores;

        Object.entries(questions[di].options[state.answers[di]].scores).forEach(([k, v]) => {
          scores[k] += v;
        });

        return scores;
      }

      function keyScores() {
        const scores = baseScores();
        questions.forEach((q, qi) => {
          if (!q.keyQuestion || state.answers[qi] === null) return;
          Object.entries(q.options[state.answers[qi]].scores).forEach(([k, v]) => {
            scores[k] += v;
          });
        });
        return scores;
      }

      function determine() {
        const totals = calcScores();
        const max = Math.max(...Object.values(totals));
        let candidates = Object.keys(totals).filter(k => totals[k] === max);

        if (candidates.length === 1) return candidates[0];

        const ds = decisiveScores();
        const dmax = Math.max(...candidates.map(k => ds[k]));
        candidates = candidates.filter(k => ds[k] === dmax);
        if (candidates.length === 1) return candidates[0];

        const ks = keyScores();
        const kmax = Math.max(...candidates.map(k => ks[k]));
        candidates = candidates.filter(k => ks[k] === kmax);
        if (candidates.length === 1) return candidates[0];

        return tieOrder.find(k => candidates.includes(k)) || candidates[0];
      }

      function fillPills(elId, items) {
        const el = $(elId);
        el.innerHTML = "";
        items.forEach(text => {
          const span = document.createElement("span");
          span.className = "pill";
          span.textContent = text;
          el.appendChild(span);
        });
      }

      function renderResult() {
        const key = determine();
        state.result = key;
        const p = profiles[key];

        document.documentElement.style.setProperty("--result-color", p.color);

        $("result-name").textContent = `你是${p.name}`;
        $("result-type").textContent = p.subtitle;
        $("result-tagline").textContent = p.tagline;

        const resultVideo = document.getElementById("result-video");
        if (resultVideo) {
          resultVideo.innerHTML = `<source src="video/result-${key}.mp4" type="video/mp4">`;
          resultVideo.load();
          resultVideo.play().catch(() => {});
        }

        const desc = $("result-desc");
        desc.innerHTML = "";
        p.description.forEach(text => {
          const node = document.createElement("p");
          node.textContent = text;
          desc.appendChild(node);
        });

        fillPills("likes-list", p.likes);
        fillPills("dislikes-list", p.dislikes);
        fillPills("daily-list", p.dailyTraits);

        $("social-style").textContent = p.socialStyle;
        $("relationship-style").textContent = p.relationshipStyle;
        $("best-match").textContent = p.bestMatch;
        $("best-match-reason").textContent = p.bestMatchReason;
        $("comp-match").textContent = p.complementaryMatch;
        $("comp-match-reason").textContent = p.complementaryMatchReason;

        const bestMatchImg = document.getElementById("best-match-img");
        const compMatchImg = document.getElementById("complementary-match-img");

        if (bestMatchImg) {
          const bestKey = Object.keys(profiles).find(k => profiles[k].name === p.bestMatch);
          if (bestKey) {
            bestMatchImg.src = `image/match-${bestKey}.jpg`;
            bestMatchImg.alt = p.bestMatch;
          }
        }

        if (compMatchImg) {
          const compKey = Object.keys(profiles).find(k => profiles[k].name === p.complementaryMatch);
          if (compKey) {
            compMatchImg.src = `image/match-${compKey}.jpg`;
            compMatchImg.alt = p.complementaryMatch;
          }
        }

        show("result");
      }

      $("start-btn").addEventListener("click", () => {
        playBgm();
        show("quiz");
        renderQ();
      });

      $("back-btn").addEventListener("click", () => {
        show("intro");
      });

      $("prev-btn").addEventListener("click", () => {
        if (state.qi > 0) {
          state.qi--;
          renderQ();
        }
      });

      $("next-btn").addEventListener("click", () => {
        if (state.answers[state.qi] === null) {
          $("quiz-hint").textContent = "還沒作答，先選一個最接近你的答案才能繼續。";
          return;
        }

        if (state.qi === questions.length - 1) {
          renderResult();
          return;
        }

        state.qi++;
        renderQ();
      });

      $("restart-btn").addEventListener("click", () => {
        state.qi = 0;
        state.answers = Array(questions.length).fill(null);
        state.result = null;

        $("progress-fill").style.width = "0%";

        show("intro");
      });
    })();
